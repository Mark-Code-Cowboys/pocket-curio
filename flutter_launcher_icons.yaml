# Launcher icon generation: dart run flutter_launcher_icons
# Source art is generated by tool/make_icon.py (PIL): curio violet
# #7A4E7E ground, a cream luggage tag with a violet place-dot.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#7A4E7E"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 26
