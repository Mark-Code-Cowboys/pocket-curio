name: pocket_curio
description: "Pocket Curio — a souvenir is a place + a memory. A private, on-device souvenir collection journal. © Code Cowboys LLC."
publish_to: 'none'
version: 0.1.0+1

environment:
  # Matches cc_core's floor — all CC apps build with the same local SDK
  # (~/sdks/flutter 3.44.9, in step with Codemagic).
  sdk: ^3.12.2

dependencies:
  cc_core:
    git:
      url: https://github.com/Mark-Code-Cowboys/cc_core.git
      ref: v0.6.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  stream_transform: ^2.1.1

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
