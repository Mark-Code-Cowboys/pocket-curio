name: pocket_curio
description: "Pocket Curio — a souvenir is a place + a memory. A private, on-device souvenir collection journal. © Code Cowboys LLC."
publish_to: 'none'
version: 1.0.0+3

environment:
  # Matches cc_core's floor — all CC apps build with the same local SDK
  # (~/sdks/flutter 3.44.9, in step with Codemagic).
  sdk: ^3.12.2

dependencies:
  cc_core:
    git:
      url: https://github.com/Mark-Code-Cowboys/cc_core.git
      ref: v0.21.2
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  # Restore picks a .zip backup (native dialogs, no permissions).
  file_selector: ^1.0.3
  flutter_riverpod: ^3.4.2
  # Camera + library capture; the composer is camera-first.
  image_picker: ^1.2.3
  path: ^1.9.1
  # App-private photo store under the documents directory.
  path_provider: ^2.1.6
  # Export and backup go out through the platform share sheet.
  share_plus: ^13.3.0
  stream_transform: ^2.1.1
  # Help, FAQ, user guide, privacy — pocketcurio.app in the browser.
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  # Migration test builds a raw v1 database file.
  sqlite3: ^3.5.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
